name: Verify shop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Shop verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Build the shop once
        run: pnpm build
      - name: Run affected scenarios
        if: github.event_name == 'pull_request'
        env:
          VERIFY_SKIP_BUILD: '1'
          VERIFY_BASE: ${{ github.event.pull_request.base.sha }}
          VERIFY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm --silent verify run --affected --base "$VERIFY_BASE" --head "$VERIFY_HEAD" --json
      - name: Run the complete suite
        if: github.event_name != 'pull_request' || vars.AFFECTED_ONLY != 'true'
        env:
          VERIFY_SKIP_BUILD: '1'
        run: pnpm --silent verify run --all --json
      - name: Publish selection and browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verification-${{ github.run_attempt }}
          path: |
            .verification/
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: ignore
